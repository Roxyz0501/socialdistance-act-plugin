name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.x
      - name: Download and verify official ACT reference
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://advancedcombattracker.com/download.php?id=57' -OutFile "$env:RUNNER_TEMP\ACTv3.zip"
          Expand-Archive "$env:RUNNER_TEMP\ACTv3.zip" "$env:RUNNER_TEMP\ACTv3"
          $act = Get-ChildItem "$env:RUNNER_TEMP\ACTv3" -Recurse -Filter 'Advanced Combat Tracker.exe' | Select-Object -First 1
          if (-not $act) { throw 'Official ACT archive did not contain Advanced Combat Tracker.exe.' }
          $name = [Reflection.AssemblyName]::GetAssemblyName($act.FullName)
          $token = ($name.GetPublicKeyToken() | ForEach-Object { $_.ToString('x2') }) -join ''
          if ($token -ne 'a946b61e93d97868') { throw 'ACT assembly publisher identity did not match.' }
          "ACT_PATH=$($act.FullName)" >> $env:GITHUB_ENV
      - name: Build plugin
        shell: pwsh
        run: dotnet build .\AetherRange\AetherRange.csproj -c Release -p:ActPath="$env:ACT_PATH" --configfile .\NuGet.Config
      - name: Build update helper
        shell: pwsh
        run: dotnet build .\SocialDistance.Updater\SocialDistance.Updater.csproj -c Release --configfile .\NuGet.Config
      - name: Build and run tests
        shell: pwsh
        run: |
          dotnet build .\SocialDistance.Tests\SocialDistance.Tests.csproj -c Release --configfile .\NuGet.Config
          .\SocialDistance.Tests\bin\Release\net48\SocialDistance.Tests.exe
      - name: Upload verified plugin DLL
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: SocialDistance-build
          path: |
            AetherRange/bin/Release/net48/SocialDistance.dll
            SocialDistance.Updater/bin/Release/net48/SocialDistance.Updater.exe
          if-no-files-found: error

      - name: Package tested binaries for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw 'Invalid release tag.' }
          .\release.ps1 -Version $Matches.version -UseBuiltBinaries
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-package
          path: release/*.zip*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish tested package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY -n release-package -D release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = "./release/SocialDistance-$env:GITHUB_REF_NAME.zip"
          gh release create $env:GITHUB_REF_NAME $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY --verify-tag --title "SocialDistance $env:GITHUB_REF_NAME" --generate-notes
