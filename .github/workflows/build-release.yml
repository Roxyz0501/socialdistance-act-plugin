name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Download and verify official ACT reference
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://advancedcombattracker.com/download.php?id=57' -OutFile "$env:RUNNER_TEMP\ACTv3.zip"
          Expand-Archive "$env:RUNNER_TEMP\ACTv3.zip" "$env:RUNNER_TEMP\ACTv3"
          $act = Get-ChildItem "$env:RUNNER_TEMP\ACTv3" -Recurse -Filter 'Advanced Combat Tracker.exe' | Select-Object -First 1
          if (-not $act) { throw 'Official ACT archive did not contain Advanced Combat Tracker.exe.' }
          $name = [Reflection.AssemblyName]::GetAssemblyName($act.FullName)
          $token = ($name.GetPublicKeyToken() | ForEach-Object { $_.ToString('x2') }) -join ''
          if ($token -ne 'a946b61e93d97868') { throw 'ACT assembly publisher identity did not match.' }
          "ACT_PATH=$($act.FullName)" >> $env:GITHUB_ENV
      - name: Build plugin
        shell: pwsh
        run: dotnet build .\AetherRange\AetherRange.csproj -c Release -p:ActPath="$env:ACT_PATH" --configfile .\NuGet.Config
      - name: Build and run tests
        shell: pwsh
        run: |
          dotnet build .\SocialDistance.Tests\SocialDistance.Tests.csproj -c Release --configfile .\NuGet.Config
          .\SocialDistance.Tests\bin\Release\net48\SocialDistance.Tests.exe
      - name: Upload verified plugin DLL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SocialDistance-build
          path: AetherRange/bin/Release/net48/SocialDistance.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Validate tag and build release assets
        id: package
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw 'Tag must be vMAJOR.MINOR.PATCH.' }
          $version = $Matches.version
          Invoke-WebRequest 'https://advancedcombattracker.com/download.php?id=57' -OutFile "$env:RUNNER_TEMP\ACTv3.zip"
          Expand-Archive "$env:RUNNER_TEMP\ACTv3.zip" "$env:RUNNER_TEMP\ACTv3"
          $act = Get-ChildItem "$env:RUNNER_TEMP\ACTv3" -Recurse -Filter 'Advanced Combat Tracker.exe' | Select-Object -First 1
          if (-not $act) { throw 'Official ACT archive did not contain Advanced Combat Tracker.exe.' }
          $name = [Reflection.AssemblyName]::GetAssemblyName($act.FullName)
          $token = ($name.GetPublicKeyToken() | ForEach-Object { $_.ToString('x2') }) -join ''
          if ($token -ne 'a946b61e93d97868') { throw 'ACT assembly publisher identity did not match.' }
          .\release.ps1 -Version $version -ActPath $act.FullName
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Create stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.package.outputs.version }}'
          gh release create '${{ github.ref_name }}' ".\release\SocialDistance-v$version.zip" ".\release\SocialDistance-v$version.zip.sha256" --repo '${{ github.repository }}' --verify-tag --title "SocialDistance v$version" --generate-notes
